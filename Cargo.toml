[workspace]
members = [
	"apps/rca-cli",
	"apps/rca-desktop",
	"crates/rca-core",
	"crates/rca-infra",
	"xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
futures-core = "0.3"
url = "2"
tracing = "0.1"
slint = "1.15.1"
slint-build = "1.15.1"
clap = { version = "4", features = ["derive"] }
rust-i18n = "3"
async-openai = "0.33"
