name: CI

on:
  push:
    branches: ["master", "dev"]
    paths:
      - "crates/**"
      - "xtask/**"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo xtask fmt --check

      - name: Clippy
        run: cargo xtask clippy --locked

      - name: Build
        run: cargo xtask build --locked

      - name: Unit tests
        run: cargo xtask test --locked --lenient-desktop

  release-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo xtask release --locked
