pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.rs"
      run: cargo test --workspace --all-features
